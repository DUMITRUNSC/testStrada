<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strada Motor · Información para la nueva web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#FAF9F6; --ink-2:#FFFFFF; --ink-3:#F2F0EB; --rule:#E7E3DB; --rule-2:#D6D1C7;
  --paper:#1C1E22; --paper-2:#50545B; --paper-3:#8B8E94;
  --gold:#A8874A; --gold-2:#8A6C33; --gold-dim:rgba(168,135,74,.10);
  --serif:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(1100px 650px at 90% -10%,rgba(200,169,106,.13),transparent 60%),
  radial-gradient(900px 600px at -10% 110%,rgba(170,185,205,.16),transparent 60%),
  linear-gradient(180deg,#FFFFFF 0%,#F7F5F1 100%);z-index:-1}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--gold);outline-offset:4px}
::selection{background:var(--gold);color:var(--ink)}

/* Marco */
.top{position:fixed;top:0;left:0;right:0;z-index:5;padding:22px clamp(20px,5vw,56px);display:flex;justify-content:space-between;align-items:center}
.brand{font:600 12px/1 var(--sans);letter-spacing:.38em;text-transform:uppercase}
.brand b{font-weight:500;color:var(--gold)}
.chapter{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--paper-3)}
.progress{position:fixed;top:0;left:0;right:0;height:2px;background:var(--rule);z-index:6}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold) 0%,var(--gold-2) 100%);transition:width .5s cubic-bezier(.2,.7,.2,1)}

.stage{min-height:100vh;min-height:100dvh;display:flex;align-items:center;padding:110px clamp(20px,6vw,72px) 120px}
.slide{width:100%;max-width:760px;margin:0 auto;animation:in .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.slide.back{animation-name:inback}
@keyframes inback{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}

.num{display:flex;align-items:center;gap:14px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:22px}
.num::after{content:"";height:1px;width:48px;background:var(--gold);opacity:.6}
h1,h2{font-family:var(--serif);font-weight:600;letter-spacing:-.02em;margin:0}
h1{font-size:clamp(38px,5.8vw,64px);line-height:1.05}
h1 em{font-style:normal;color:var(--gold)}
h2{font-size:clamp(26px,3.4vw,38px);line-height:1.2}
.help{color:var(--paper-2);font-size:16px;margin:14px 0 0;max-width:60ch}
.pre{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-size:13px;color:var(--gold-2);background:#F6EFE1;padding:6px 12px;border-radius:999px}

/* Campos */
.field{margin-top:40px}
.field input[type=text],.field input[type=email],.field input[type=tel],.field input[type=url],.field textarea{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--rule-2);padding:10px 0 14px;font:500 clamp(19px,2.1vw,23px)/1.4 var(--serif);color:var(--paper);transition:border-color .2s}
.field textarea{resize:none;min-height:56px;overflow:hidden;font-size:clamp(17px,1.9vw,20px)}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--gold)}
::placeholder{color:#B3AFA7}
.opts{display:grid;gap:10px;max-width:560px}
.opts.cols{grid-template-columns:repeat(2,minmax(0,1fr));max-width:none}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt label{display:flex;align-items:center;gap:16px;padding:15px 18px;border:1px solid var(--rule-2);background:var(--ink-2);box-shadow:0 1px 2px rgba(28,30,34,.03);border-radius:8px!important;cursor:pointer;transition:border-color .2s,background .2s;font-size:15.5px;border-radius:2px}
.opt label:hover{border-color:var(--paper-3)}
.opt kbd{flex:none;width:26px;height:26px;border-radius:6px!important;display:grid;place-items:center;border:1px solid var(--rule-2);font:500 11px var(--sans);color:var(--paper-3);border-radius:2px;transition:all .2s}
.opt label .tick{margin-left:auto;width:14px;height:8px;border-left:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(-45deg) scale(0);transition:transform .2s;margin-top:-4px}
.opt input:checked+label{border-color:var(--gold);background:#FBF6EC}
.opt input:checked+label .tick{transform:rotate(-45deg) scale(1)}
.opt input:checked+label kbd{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.opt input:focus-visible+label{outline:1px solid var(--gold);outline-offset:3px}
.opt.extra label{background:transparent;border-style:dashed;color:var(--paper-2)}
.opt.extra input:checked+label{border-style:solid;color:var(--paper)}
.otro{margin-top:14px;max-width:560px}
.otro[hidden]{display:none}
.otro input{width:100%;background:var(--ink-2);border:1px solid var(--rule-2);border-radius:8px;padding:13px 16px;font:500 16px var(--sans);color:var(--paper)}
.otro input:focus{outline:none;border-color:var(--gold)}
.multi-note{font-size:12px;letter-spacing:.06em;color:var(--paper-3);margin:0 0 14px}

.actions{display:flex;align-items:center;gap:22px;margin-top:44px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;background:var(--paper);color:#fff;padding:15px 26px;font:600 15px/1 var(--sans);letter-spacing:0;border-radius:999px;box-shadow:0 6px 18px rgba(28,30,34,.14);transition:background .2s,transform .2s}
.btn:hover{background:#34373D}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--ink-2);color:var(--paper);border:1px solid var(--rule-2);box-shadow:none}
.btn.ghost:hover{border-color:var(--paper-3);background:var(--ink-2);color:var(--paper)}
.hint{font-size:12px;color:var(--paper-3);letter-spacing:.04em}
.hint kbd{font:500 11px var(--sans);border:1px solid var(--rule-2);padding:2px 6px;border-radius:2px;margin:0 2px}
.later{border:0;background:none;color:var(--paper-3);font-size:13px;cursor:pointer;padding:0;text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:5px}
.later:hover{color:var(--gold-2);text-decoration-color:var(--gold)}
.later.on{color:var(--gold)}

.foot{position:fixed;bottom:0;left:0;right:0;padding:18px clamp(20px,5vw,56px);display:flex;justify-content:space-between;align-items:center;z-index:5;background:linear-gradient(0deg,var(--ink) 30%,transparent)}
.arrows{display:flex;gap:6px}
.arrows button{width:42px;height:42px;border:1px solid var(--rule-2);background:var(--ink-2);color:var(--paper-2);cursor:pointer;border-radius:999px;display:grid;place-items:center;transition:border-color .2s}
.arrows button:hover:not(:disabled){border-color:var(--gold);color:var(--gold-2)}
.arrows button:disabled{opacity:.3;cursor:default}
.arrows svg{width:14px;height:14px}
.count{font-size:12px;letter-spacing:.14em;color:var(--paper-3);font-variant-numeric:tabular-nums}

/* Portada */
.cover p.lead{font:400 18px/1.7 var(--sans);color:var(--paper-2);max-width:54ch;margin:30px 0 0}
.facts{display:flex;gap:40px;margin-top:40px;padding-top:26px;border-top:1px solid var(--rule);flex-wrap:wrap}
.facts div{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-3)}
.facts b{display:block;font:600 28px/1.1 var(--serif);letter-spacing:0;text-transform:none;color:var(--paper);margin-bottom:4px}

/* Capítulo */
.chap h1{font-size:clamp(40px,6.5vw,72px)}
.chap .roman{font:600 13px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}

/* Resumen */
.summary{max-width:860px}
.sum-sec{margin-top:46px}
.sum-sec h3{font:600 22px var(--serif);margin:0 0 14px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:10px}
.sum-sec h3 span{font:400 11px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.row{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:20px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.row dt{color:var(--paper-3)}
.row dd{margin:0;white-space:pre-wrap;word-break:break-word}
.row dd.no{color:var(--paper-3)}
.row button{border:0;background:none;color:var(--paper-3);font-size:12px;cursor:pointer;padding:0;margin-left:10px;text-decoration:underline;text-underline-offset:3px}
.row button:hover{color:var(--gold-2)}
.tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(200,169,106,.4);padding:2px 7px;margin-left:8px;white-space:nowrap;border-radius:2px}
.sendbox{margin-top:36px;padding:28px;border:1px solid var(--rule);border-radius:14px;background:linear-gradient(135deg,#FFFFFF 0%,#F8F2E6 100%);box-shadow:0 10px 30px rgba(28,30,34,.06)}
.sendbox p{margin:0 0 20px;color:var(--paper-2);font-weight:300}

.toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,10px);background:var(--paper);color:#fff;border-radius:999px!important;padding:11px 18px;font-size:13px;letter-spacing:.04em;opacity:0;pointer-events:none;transition:all .25s;z-index:10;border-radius:2px}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:640px){
  .chapter{display:none}
  .opts.cols{grid-template-columns:1fr}
  .row{grid-template-columns:1fr;gap:4px}
  .hint{display:none}
  .facts{gap:24px}
}
@media (prefers-reduced-motion:reduce){.slide{animation:none}.progress i{transition:none}}
@media print{
  @page{size:A4;margin:2.2cm 2.5cm}
  body{background:#fff;color:#111;font-size:11pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body::before,.top,.progress,.foot,.sendbox,.toast{display:none!important}

  /* Ocultar botones de UI */
  .row button,.sum-sec h3 .edit,.actions{display:none!important}

  .stage{padding:0;min-height:0;display:block}
  .slide{max-width:none;animation:none}

  /* Cabecera del documento */
  .summary>.num{font-size:8pt;letter-spacing:.22em;color:#8a6d36;margin-bottom:10pt}
  .summary h1{font-size:20pt;line-height:1.15;margin:0 0 10pt}
  .summary>.help{font-size:9.5pt;color:#666;margin:0 0 0;max-width:none}

  /* Secciones */
  .sum-sec{margin-top:22pt;break-before:auto}
  .sum-sec h3{font-size:12pt;border-color:#ccc;padding-bottom:7pt;margin-bottom:0;display:block}
  .sum-sec h3 span{display:none}

  /* Filas pregunta/respuesta */
  .row{
    display:grid;
    grid-template-columns:2fr 3fr;
    gap:6px 16px;
    padding:7pt 0;
    border-color:#e5e5e5;
    break-inside:avoid;
    page-break-inside:avoid;
    font-size:9.5pt;
    line-height:1.45
  }
  .row dt{color:#666;font-weight:400}
  .row dd.no{color:#bbb;font-style:italic}
  .tag{font-size:8pt;color:#8a6d36;border-color:rgba(138,109,54,.4)}
}

/* Página por sección */
.topright{display:flex;align-items:center;gap:18px}
.sync{font-size:12px;color:var(--paper-3)}
.sync.ok::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#2E8B5C;margin-right:6px;vertical-align:1px}
.sync.err{color:#B4532A}
.sent{margin-top:18px;padding:14px 16px;border-radius:10px;background:#EAF4EE;color:#245C3F;font-size:15px}

.ol{display:flex;flex-direction:column;gap:2px}
.ol small{font-size:12.5px;line-height:1.35;color:var(--paper-3)}

.imp{display:inline-block;vertical-align:4px;margin-left:10px;font:600 10.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-2);background:#F6EFE1;padding:3px 8px;border-radius:999px}

.qlist{counter-reset:q}
.qblock:not([hidden]){counter-increment:q}
.qn::before{content:attr(data-sec) "." counter(q)}

.sechead .roman{font:600 13px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sechead h1{font-size:clamp(36px,5vw,56px)}
.foot{display:none}
.stage{padding-bottom:80px}

.stage{align-items:flex-start}
.sechead{padding-bottom:12px}
.qlist{margin-top:28px}
.qblock{display:grid;grid-template-columns:56px minmax(0,1fr);gap:0 8px;padding:38px 0;border-top:1px solid var(--rule)}
.qblock[hidden]{display:none}
.qn{font:600 13px var(--sans);color:var(--gold);padding-top:6px;font-variant-numeric:tabular-nums}
.qblock h2{font-size:clamp(20px,2.3vw,25px);line-height:1.3}
.qblock .help{font-size:15px;margin-top:8px}
.qblock .field{margin-top:22px}
.qblock .later{margin-top:16px}
.qblock .opt label{padding:12px 16px;font-size:15px}
.qblock textarea{min-height:52px}
.secnav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:24px;padding-top:32px;border-top:1px solid var(--rule)}
.toc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:44px}
.toc button{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--rule);background:var(--ink-2);border-radius:10px;padding:12px 14px;font-size:14.5px;cursor:pointer;transition:border-color .2s}
.toc button:hover{border-color:var(--paper-3)}
.toc span{font-weight:600;color:var(--gold);width:16px}
.toc small{margin-left:auto;color:var(--paper-3);font-variant-numeric:tabular-nums}
.sum-sec h3 .edit{border:0;background:none;font:500 13px var(--sans);letter-spacing:0;text-transform:none;color:var(--paper-3);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.sum-sec h3 .edit:hover{color:var(--paper)}
@media (max-width:640px){.qblock{grid-template-columns:1fr}.qn{padding:0 0 6px}.toc{grid-template-columns:1fr}.secnav .btn{flex:1;justify-content:center}}
@media print{.toc,.secnav{display:none!important}}
</style>
</head>
<body>
<div class="progress"><i id="bar"></i></div>
<header class="top">
  <div class="brand">Strada <b>Motor</b></div>
  <div class="topright"><span class="sync" id="sync"></span><div class="chapter" id="chap"></div></div>
</header>
<main class="stage"><div class="slide" id="slide"></div></main>
<footer class="foot">
  <span class="count" id="count"></span>
  <div class="arrows">
    <button type="button" id="prev" aria-label="Anterior"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 9l5-5 5 5"/></svg></button>
    <button type="button" id="next" aria-label="Siguiente"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 5l5 5 5-5"/></svg></button>
  </div>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const WEB="Lo hemos sacado de vuestra web actual. Revisadlo";
const PROP="Propuesta nuestra. Cambiad o añadid lo que queráis";
const CH=[
 {n:"1",t:"La empresa",s:"Los datos que tienen que salir bien en la web, en Google y en el aviso legal."},
 {n:"2",t:"Quiénes sois",s:"En la importación el cliente compra confianza antes que un coche."},
 {n:"3",t:"Qué ofrecéis",s:"Vuestros servicios, los coches que traéis y el cliente que buscáis."},
 {n:"4",t:"Cómo trabajáis",s:"El proceso, cómo revisáis los coches y cómo llegan a España."},
 {n:"5",t:"Precio y condiciones",s:"Lo que más pregunta el cliente y lo que decide si os encarga el coche."},
 {n:"6",t:"Confianza",s:"Pruebas reales de que se puede confiar en vosotros."},
 {n:"7",t:"Web y Google",s:"Qué tiene que conseguir la web y cómo hacer que aparezca la primera."}
];
const SERV=["Buscamos y traemos el coche que pide el cliente","Traemos un coche que el cliente ya ha encontrado","Vendemos coches que ya tenemos en España","Compramos el coche del cliente","Aceptamos su coche como parte del pago","Ofrecemos financiación","Exportamos coches de España a otros países"];
const SV=SERV.map(x=>x.split("|")[0]);
const REDES=["Instagram","Facebook","TikTok","YouTube","LinkedIn","coches.net","AutoScout24","Wallapop","Milanuncios","mobile.de"];
const REDES_PRE={"Instagram":"@strada_motor","AutoScout24":"autoscout24.es/profesionales/strada-motor"};
const TIPOS=["Deportivos|Porsche 911, BMW M3, Mercedes-AMG GT…","Superdeportivos|Ferrari, Lamborghini, McLaren…","SUV de alta gama|Cayenne, X5 M, G63, Range Rover…","Berlinas y coupés premium|Clase E, Serie 5, A6, Panamera…","Familiares y monovolúmenes|Clase V, Touran, Serie 2 Tourer…","Coches del día a día|Golf, A3, Serie 1, Clase A…","Eléctricos e híbridos|Taycan, Tesla, e-tron, híbridos enchufables…","Clásicos y de colección|Coches de más de 25 años"];
const MARCAS=["Porsche","Mercedes-Benz / AMG","BMW / M","Audi / RS","Volkswagen","Land Rover / Range Rover","Ferrari","Lamborghini","McLaren","Bentley / Rolls-Royce","Tesla"];
const Qs=[
 {c:0,id:"nombre",k:1,q:"Nombre de la empresa",h:"Tal como queréis que aparezca en la web.",type:"text",pre:"Strada Motor",src:WEB},
 {c:0,id:"razon",k:1,q:"Razón social",h:"Para el aviso legal y la política de privacidad.",type:"text",ph:"Ej.: Strada Motor S.L."},
 {c:0,id:"cif",k:1,q:"CIF",type:"text"},
 {c:0,id:"direccion",k:1,q:"¿Dónde atendéis a los clientes?",h:"Ojo: vuestra web dice Alcorcón, pero AutoScout24 muestra otra dirección en Madrid. Escribid la correcta.",type:"text",pre:"C. Valdemorillo, 41, 28925 Alcorcón, Madrid",src:WEB},
 {c:0,id:"tipo_local",q:"¿Qué hay en esa dirección?",type:"one",o:["Exposición con coches|Se pueden venir a ver coches","Oficina|Se atiende, pero no hay coches expuestos","Solo se atiende con cita|No hay horario de visita abierto"]},
 {c:0,id:"corregir",q:"¿Hay datos vuestros en internet que estén mal y haya que corregir?",h:"Direcciones antiguas, teléfonos que ya no usáis, fichas duplicadas…",type:"area"},
 {c:0,id:"telefono",k:1,q:"Teléfono",type:"tel",pre:"+34 682 03 80 80",src:WEB},
 {c:0,id:"whatsapp",q:"¿Atendéis por WhatsApp?",type:"one",o:["Sí, con el mismo número","Sí, con otro número","No usamos WhatsApp"]},
 {c:0,id:"whatsapp_num",q:"¿Qué número usáis para WhatsApp?",type:"tel",show:["whatsapp",["Sí, con otro número"]]},
 {c:0,id:"email",k:1,q:"Email de contacto",h:"Aquí llegarán las solicitudes de la web.",type:"email",pre:"info@stradamotor.com",src:WEB},
 {c:0,id:"horario",q:"Horario de atención",type:"text",ph:"Ej.: lunes a viernes de 10:00 a 19:00, sábados con cita"},
 {c:0,id:"redes",q:"¿En qué redes y portales tenéis perfil?",h:"Marcad todos. Al marcar uno os pediremos el nombre del perfil o el enlace.",type:"multi",cols:1,o:REDES,pre:["Instagram","AutoScout24"],src:"Los hemos encontrado en internet. Revisadlo"},

 {c:1,id:"equipo",k:1,q:"¿Quiénes formáis el equipo?",h:"Nombre, cargo y de qué se encarga cada uno.",type:"area",ph:"Ej.: Carlos — fundador — busca y revisa los coches en Alemania"},
 {c:1,id:"cara",q:"¿Queréis salir en la web?",h:"Ver a las personas que hay detrás da mucha confianza.",type:"one",o:["Sí, con nombre y foto|Lo que más confianza da","Solo con el nombre|Sin foto","Prefiero que no|Hablamos como empresa"]},
 {c:1,id:"origen",q:"¿Cómo empezó Strada Motor?",h:"Cuándo y por qué. En vuestra web pone que importáis desde 2023.",type:"area"},
 {c:1,id:"alemania",q:"¿Qué relación tenéis con Alemania?",h:"Si habláis alemán, si viajáis allí, si tenéis proveedores o contactos fijos.",type:"area"},

 {c:2,id:"servicios",k:1,q:"¿Qué hacéis?",h:"Marcad todo lo que hacéis hoy.",type:"multi",cols:1,o:SERV},
 {c:2,id:"stock",q:"¿Cuántos coches soléis tener a la venta y cada cuánto cambian?",type:"text",show:["servicios",[SV[2]]],ph:"Ej.: entre 5 y 10, cambian cada mes"},
 {c:2,id:"compra",q:"Cuando compráis el coche de un cliente, ¿cómo lo hacéis?",type:"one",show:["servicios",[SV[3]]],o:["Se lo pagamos nosotros|Le pagamos el coche y lo vendemos después","Lo vendemos por él|El coche sigue siendo suyo hasta que se vende (depósito)","Las dos opciones|Según el caso"]},

      ${q.src&&v===q.pre?`<div class="pre" data-pre="${uid}">${esc(q.src)}</div>`:""}
      <div class="field">${f}</div>
      <button type="button" class="later ${st.u[uid]?"on":""}" data-later="${uid}">${st.u[uid]?"✓ Marcado como “no lo sé todavía”":"No lo sé todavía"}</button>
    </div>
  </article>`;
}
function secProgress(ci){const qs=Qs.filter(q=>q.c===ci&&visible(q));return [qs.filter(q=>valQ(q)||st.u[q.id]).length,qs.length]}
function render(){
  const pg=PAGES[st.p];let h="";
  if(pg==="cover"){
    h=`<div class="cover"><div class="num">Strada Motor · Nueva web</div>
      <h1>Información para<br><em>vuestra nueva web</em></h1>
      <p class="lead">Estamos preparando la nueva web de Strada Motor. Para que sea la mejor de vuestro sector y aparezca en las primeras posiciones de Google, necesitamos conocer bien la empresa: quiénes sois, qué ofrecéis y cómo trabajáis.</p>
      <p class="lead" style="margin-top:12px">Son ${CH.length} secciones. En cada una veréis todas sus preguntas juntas. Lo que ya aparece en vuestra web actual viene rellenado: solo tenéis que revisarlo. Si alguna no la sabéis, marcad “No lo sé todavía” y seguid. Si vais justos de tiempo, empezad por las marcadas como <b style="color:var(--gold-2)">Importante</b>.</p>
      <div class="facts"><div><b>${CH.length}</b>secciones</div><div><b>${VQ().length}</b>preguntas</div><div><b>25 min</b>aproximadamente</div></div>
      <div class="actions"><button class="btn" data-go="1">Empezar <span aria-hidden="true">→</span></button>
      <span class="hint">Se guarda solo. Podéis dejarlo a medias y seguir otro día.</span></div></div>`;
  }else if(pg==="end"){
    const pend=VQ().filter(q=>!valQ(q)&&!st.u[q.id]&&q.id!=="extra").length;
    h=`<div class="summary"><div class="num">Resumen</div><h1>Revisad vuestras respuestas</h1>
      <p class="help">Si queréis cambiar algo, pulsad “Editar” en la sección.${pend?` Quedan <b style="color:var(--paper)">${pend}</b> preguntas sin responder. No pasa nada: enviadnos lo que tengáis y lo completamos juntos.`:""}</p>
      <div class="sendbox" style="margin-top:32px">${ONLINE?`<p>Vuestras respuestas se van guardando solas. Cuando terminéis, pulsad <b style="color:var(--paper);font-weight:600">Enviar respuestas</b> para avisarnos de que está listo. Podréis seguir cambiando cosas después.</p>
        <div class="actions" style="margin-top:0"><button class="btn" id="send">${st.sent?"Volver a enviar":"Enviar respuestas"}</button><button class="btn ghost" id="pdf">Guardar copia en PDF</button></div>${st.sent?'<div class="sent">✓ Respuestas enviadas. ¡Gracias!</div>':""}<div id="sendmsg"></div>`:`<p>Cuando esté listo, pulsad <b style="color:var(--paper);font-weight:600">Copiar respuestas</b> y enviádnoslo por WhatsApp o por email. También podéis guardarlo en PDF.</p>
        <div class="actions" style="margin-top:0"><button class="btn" id="copy">Copiar respuestas</button><button class="btn ghost" id="pdf">Guardar en PDF</button><button class="btn ghost" id="txt">Descargar texto</button></div>`}</div>
      ${CH.map((c,ci)=>`<section class="sum-sec"><h3>${esc(c.t)}<button class="edit" data-go="${ci+1}">Editar</button></h3><dl>${VQ().filter(q=>q.c===ci).map(q=>{const v=valQ(q);
        return `<div class="row"><dt>${esc(q.q)}</dt><dd class="${v?"":"no"}">${v?esc(v):"Sin responder"}${st.u[q.id]?'<span class="tag">Por decidir</span>':""}</dd></div>`}).join("")}</dl></section>`).join("")}
    </div>`;
  }else{
    const c=CH[pg],qs=Qs.filter(q=>q.c===pg);let n=0;
    h=`<header class="sechead"><div class="roman">Sección ${c.n} de ${CH.length}</div><h1>${esc(c.t)}</h1><p class="help" style="font-size:18px">${esc(c.s)}</p></header>
      <div class="qlist">${qs.map(q=>qBlock(q,`${c.n}.${++n}`)).join("")}</div>
      <div class="secnav">
        <button class="btn ghost" data-go="${st.p-1}">← ${st.p===1?"Inicio":"Sección anterior"}</button>
        <button class="btn" data-go="${st.p+1}">${pg===CH.length-1?"Revisar y enviar":"Siguiente sección"} <span aria-hidden="true">→</span></button>
      </div>`;
  }
  slide.className="slide"+(dir<0?" back":"");void slide.offsetWidth;
  slide.innerHTML=h;
  wire(pg);
  document.getElementById("bar").style.width=(st.p/(PAGES.length-1)*100)+"%";
  document.getElementById("count").textContent="";
  document.getElementById("chap").textContent=typeof pg==="number"?`Sección ${CH[pg].n} · ${CH[pg].t}`:"";
  document.getElementById("prev").disabled=st.p===0;
  document.getElementById("next").disabled=st.p===PAGES.length-1;
  window.scrollTo(0,0);
}
function grow(t){t.style.height="auto";t.style.height=t.scrollHeight+"px"}
function refreshVisibility(){Qs.forEach(q=>{const el=document.getElementById("q_"+q.id);if(el)el.hidden=!visible(q)})}
function wire(pg){
  slide.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
  if(typeof pg==="number"){
    slide.querySelectorAll("[data-in]").forEach(inp=>{
      const q=Qs.find(x=>x.id===inp.dataset.in);
      if(inp.tagName==="TEXTAREA")grow(inp);
      inp.addEventListener("input",()=>{st.a[q.id]=inp.value;if(inp.tagName==="TEXTAREA")grow(inp);const p=slide.querySelector(`[data-pre="${q.id}"]`);if(p&&inp.value!==q.pre)p.remove();save()});
    });
    slide.querySelectorAll("[data-otro]").forEach(inp=>inp.addEventListener("input",()=>{st.a[inp.dataset.otro+"__otro"]=inp.value;save()}));
    Qs.filter(q=>q.c===pg&&q.o).forEach(q=>{
      const boxes=[...slide.querySelectorAll(`input[name="${q.id}"]`)],block=document.getElementById("q_"+q.id);
      const otroBox=block.querySelector(".otro"),otro=block.querySelector("[data-otro]"),base=q.o.filter(o=>!isNone(o));
      const showOtro=on=>{otroBox.hidden=!on;if(on)setTimeout(()=>otro.focus(),50)};
      const by=x=>boxes.find(b=>b.value===x);
      boxes.forEach(o=>o.addEventListener("change",()=>{
        if(q.type==="one"){st.a[q.id]=o.value;showOtro(o.value===OTRA1)}
        else{
          if(o.value===TODAS){base.forEach(b=>{const el=by(b);if(el)el.checked=o.checked});boxes.forEach(b=>{if(isNone(b.value)||b.value===NINGUNA)b.checked=false})}
          else if(o.checked&&(isNone(o.value)||o.value===NINGUNA)){boxes.forEach(b=>{if(b!==o)b.checked=false})}
          else if(o.checked){boxes.forEach(b=>{if(isNone(b.value)||b.value===NINGUNA)b.checked=false})}
          const t=by(TODAS);if(t)t.checked=base.every(b=>by(b)&&by(b).checked);
          st.a[q.id]=boxes.filter(b=>b.checked&&b.value!==TODAS).map(b=>b.value);
          showOtro(st.a[q.id].includes(OTRA));
        }
        save();refreshVisibility();
      }));
    });
    slide.querySelectorAll("[data-later]").forEach(b=>b.onclick=()=>{const id=b.dataset.later;st.u[id]=!st.u[id];save();b.classList.toggle("on",st.u[id]);b.textContent=st.u[id]?"✓ Marcado como “no lo sé todavía”":"No lo sé todavía"});
  }
  if(pg==="end"){
    document.getElementById("pdf").onclick=()=>generarPDF();
    const sb=document.getElementById("send");
    if(sb)sb.onclick=async()=>{sb.disabled=true;sb.textContent="Enviando…";clearTimeout(syncTimer);
      const ok=await pushNow("enviado");
      if(ok){st.sent=true;try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){};render();toast("Respuestas enviadas")}
      else{sb.disabled=false;sb.textContent="Enviar respuestas";document.getElementById("sendmsg").innerHTML='<div class="sent" style="background:#FBEDE6;color:#8A3B1C">No se han podido enviar ahora. Revisad la conexión y volved a pulsar. Vuestras respuestas no se pierden.</div>'}};
    if(!document.getElementById("copy"))return;
    document.getElementById("copy").onclick=copy;
    document.getElementById("txt").onclick=()=>{const b=new Blob([text()],{type:"text/plain;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="strada-motor-informacion-web.txt";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast("Archivo descargado")};
  }
}
function go(n){if(n<0||n>=PAGES.length)return;dir=n>st.p?1:-1;st.p=n;save();render()}
function text(){
  const out=["STRADA MOTOR · INFORMACIÓN PARA LA NUEVA WEB",""];
  CH.forEach((c,ci)=>{out.push(`${c.n}. ${c.t.toUpperCase()}`);VQ().filter(q=>q.c===ci).forEach(q=>{out.push(`— ${q.q}`);out.push(`  ${valQ(q)||"(sin responder)"}${st.u[q.id]?"  [POR DECIDIR]":""}`)});out.push("")});
  return out.join("\n");
}
async function copy(){try{await navigator.clipboard.writeText(text());toast(“Copiado. Pegadlo en WhatsApp o en un email”)}catch(e){toast(“No se pudo copiar. Usad “Descargar texto””)}}
function generarPDF(){
  const fecha=new Date().toLocaleDateString(“es-ES”,{day:”2-digit”,month:”long”,year:”numeric”});
  const e=s=>String(s??””).replace(/[&<>”]/g,c=>({“&”:”&amp;”,”<”:”&lt;”,”>”:”&gt;”,'”':”&quot;”}[c]));
  const css=`@page{size:A4;margin:2.2cm 2.8cm}*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,-apple-system,”Segoe UI”,sans-serif;font-size:10pt;color:#111;line-height:1.5;background:#fff}.doc-head{padding-bottom:16pt;border-bottom:1.5pt solid #111;margin-bottom:24pt}.brand{font-size:8pt;letter-spacing:.38em;text-transform:uppercase;color:#8a6d36;margin-bottom:6pt}.brand b{font-weight:400}h1{font-size:19pt;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-bottom:6pt}.meta{font-size:8pt;color:#999}.section{margin-top:22pt}.sec-head{font-size:7.5pt;letter-spacing:.22em;text-transform:uppercase;color:#8a6d36;padding-bottom:5pt;border-bottom:1pt solid #ddd;margin-bottom:0}.row{display:grid;grid-template-columns:2fr 3fr;gap:5pt 18pt;padding:6pt 0;border-bottom:.5pt solid #eee;break-inside:avoid;page-break-inside:avoid}.q{color:#666;font-size:9pt}.a{font-size:9.5pt;font-weight:500;word-break:break-word}.a.no{color:#bbb;font-style:italic;font-weight:400}.imp{font-size:7pt;letter-spacing:.1em;text-transform:uppercase;color:#8a6d36;background:#f6efe1;padding:1pt 4pt;border-radius:2pt;margin-left:5pt;vertical-align:2pt;white-space:nowrap}.tag{font-size:7pt;letter-spacing:.1em;text-transform:uppercase;color:#8a6d36;border:.5pt solid rgba(138,109,54,.5);padding:1pt 4pt;margin-left:5pt;vertical-align:2pt;white-space:nowrap}`;
  let rows=””;
  CH.forEach((c,ci)=>{
    const qs=VQ().filter(q=>q.c===ci);
    if(!qs.length)return;
    rows+=`<div class=”section”><div class=”sec-head”>${e(c.n)}. ${e(c.t)}</div>`;
    qs.forEach(q=>{
      const v=valQ(q);
      rows+=`<div class=”row”><div class=”q”>${e(q.q)}${q.k?'<span class=”imp”>Importante</span>':''}</div><div class=”a${v?'':' no'}”>${v?e(v):'Sin responder'}${st.u[q.id]?'<span class=”tag”>Por decidir</span>':''}</div></div>`;
    });
    rows+=`</div>`;
  });
  const parts=[
    `<!DOCTYPE html><html lang=”es”><head><meta charset=”utf-8”><title>Strada Motor \xB7 Informaci\xF3n para la nueva web</title><style>`,
    css,
    `</style></head><body><div class=”doc-head”><div class=”brand”>Strada <b>Motor</b></div><h1>Informaci\xF3n para<br>la nueva web</h1><div class=”meta”>Generado el `,
    e(fecha),
    `</div></div>`,
    rows,
    `</body></html>`
  ];
  const blob=new Blob(parts,{type:”text/html;charset=utf-8”});
  const url=URL.createObjectURL(blob);
  const w=window.open(url,”_blank”);
  setTimeout(()=>{if(w)w.print();URL.revokeObjectURL(url)},800);
}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2400)}
document.getElementById("prev").onclick=()=>go(st.p-1);
document.getElementById("next").onclick=()=>go(st.p+1);
if(ONLINE&&!qsId){try{const u=new URL(location.href);u.searchParams.set("id",st.id);history.replaceState(null,"",u)}catch(e){}}
render();loadRemote();
</script>
</body>
</html>
